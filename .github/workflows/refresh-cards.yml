name: Refresh profile cards

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'render_cards.py'
      - 'profile.json'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/refresh-cards.yml'

concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the font subsetter
        run: python -m pip install -r requirements.txt
      - name: Refresh contribution JSON from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python render_cards.py --refresh
      - name: Render animated cards and README
        run: python render_cards.py
      - name: Commit refreshed data and rendered cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json cards/ README.md preview.html
          if git diff --cached --quiet; then
            echo 'Cards are already up to date.'
            exit 0
          fi
          git commit -m 'Refresh profile contribution cards'
          git push
