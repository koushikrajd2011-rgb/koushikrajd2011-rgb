<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="156" viewBox="0 0 320 156" role="img" aria-labelledby="title description"><title id="title">Repositories</title><desc id="description">Repositories</desc><defs><style><![CDATA[@font-face{font-family:Display;src:url(data:font/woff;base64,) format('woff');font-weight:400 800;font-display:block}@font-face{font-family:Body;src:url(data:font/woff;base64,) format('woff');font-weight:400 800;font-display:block}text{font-family:Body,Arial,sans-serif}.display{font-family:Display,Arial,sans-serif}.heavy{font-weight:700}
@keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes hatSwish{
 0%{opacity:0;transform:translate(-500px,15px) rotate(-500deg) scale(.8,.35)}
 12%{opacity:1;transform:translate(-385px,-28px) rotate(-380deg) scale(1,.8)}
 34%{opacity:1;transform:translate(-235px,-48px) rotate(-210deg) scale(1.15,.28)}
 55%{opacity:1;transform:translate(-100px,-30px) rotate(-90deg) scale(1,.95)}
 73%{opacity:1;transform:translate(35px,-42px) rotate(30deg) scale(1,.55)}
 88%{opacity:1;transform:translate(8px,-18px) rotate(-12deg) scale(1,.95)}
 96%{opacity:1;transform:translate(-1px,-3px) rotate(4deg) scale(1)}
 100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
}
@keyframes windSwish{0%{opacity:0;transform:translateX(-100px)}25%{opacity:.25}65%{opacity:.16}100%{opacity:0;transform:translateX(160px)}}
.wind{opacity:0}

@keyframes grow{from{transform:scaleY(.02);opacity:.2}to{transform:scaleY(1);opacity:1}}
@media(prefers-reduced-motion:no-preference){
 .wind{animation:windSwish 2.6s ease .1s both}
 .hat{transform-box:fill-box;transform-origin:center bottom;animation:hatSwish 2.8s cubic-bezier(.38,.05,.4,1) .1s both}
 .reveal{animation:arrive .65s cubic-bezier(.2,.7,.2,1) 3.23s both}
 .late{animation:arrive .65s ease 3.41s both}
 .bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .9s cubic-bezier(.2,.7,.2,1) calc(3.23s + var(--i,0)*.055s) both}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
 .reveal,.late,.bar,.hat{opacity:1!important;transform:none!important}
 .smil-motion,.wind{display:none!important;opacity:0!important}
}
]]></style><linearGradient id="magma" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffc51b"/><stop offset="1" stop-color="#ff2867"/></linearGradient><filter id="raised" x="-25%" y="-50%" width="150%" height="200%" color-interpolation-filters="sRGB"><feDropShadow dx="7" dy="7" stdDeviation="7" flood-color="#171319" flood-opacity=".85"/><feDropShadow dx="-7" dy="-7" stdDeviation="7" flood-color="#433740" flood-opacity=".38"/></filter><filter id="button" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#171319" flood-opacity=".85"/><feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#433740" flood-opacity=".38"/></filter><filter id="inset" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB"><feComponentTransfer in="SourceAlpha" result="inverse"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer><feGaussianBlur in="inverse" stdDeviation="4" result="blur"/><feOffset in="blur" dx="4" dy="4" result="dark"/><feComposite in="dark" in2="SourceAlpha" operator="in" result="dark-mask"/><feFlood flood-color="#17151b" flood-opacity=".7" result="dark-color"/><feComposite in="dark-color" in2="dark-mask" operator="in" result="inner-dark"/><feOffset in="blur" dx="-4" dy="-4" result="light"/><feComposite in="light" in2="SourceAlpha" operator="in" result="light-mask"/><feFlood flood-color="#433740" flood-opacity=".38" result="light-color"/><feComposite in="light-color" in2="light-mask" operator="in" result="inner-light"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner-dark"/><feMergeNode in="inner-light"/></feMerge></filter></defs><rect width="320" height="156" fill="#302b31"/><rect x="16" y="16" width="288" height="124" rx="28" fill="#302b31" filter="url(#raised)"/><g class="reveal"><circle cx="55" cy="55" r="22" fill="#302b31" filter="url(#button)"/><g transform="translate(43 43) scale(1.0)" fill="none" stroke="#9bf23b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7m8-14 6 7-6 7M14 2l-4 20"/></g><text x="36" y="118" font-size="22" fill="#fff3e8" class="display" >Repositories</text><g transform="translate(264 103) scale(0.65)" fill="none" stroke="#9bf23b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 16 16 0M0 0h16v16"/></g></g></svg>
